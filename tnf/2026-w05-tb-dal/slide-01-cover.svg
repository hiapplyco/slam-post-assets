<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .font-heading { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .font-heading-heavy { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Menlo', monospace; font-weight: 700; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#000000" />
  <rect width="1080" height="1350" fill="url(#gridPattern)" />
  <circle cx="900" cy="200" r="300" fill="#FED603" opacity="0.04" filter="blur(80px)" />
  <circle cx="150" cy="900" r="350" fill="#0C92F1" opacity="0.05" filter="blur(80px)" />
  
  
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="14" height="28" rx="3" fill="#FED603" />
    <rect x="20" y="0" width="6" height="28" rx="3" fill="#0C92F1" />
    <text x="36" y="20" class="font-heading" font-size="20" fill="#FFFFFF" letter-spacing="2">SLAM SPORTS AI</text>
    <rect x="360" y="-2" width="235" height="32" rx="16" fill="#121212" stroke="#383838" stroke-width="1.5" />
    <circle cx="376" cy="14" r="5" fill="#FED603" />
    <text x="392" y="19" class="font-mono" font-size="12" fill="#FFFFFF" letter-spacing="1.5">PREGAME INTELLIGENCE</text>
    <text x="960" y="20" class="font-mono" font-size="15" fill="#666666" letter-spacing="2" text-anchor="end">01 / 07</text>
  </g>
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="256" height="38" rx="8" fill="rgba(254, 214, 3, 0.12)" stroke="#FED603" stroke-width="1.5" />
    <text x="18" y="24" class="font-mono" font-size="14" fill="#FED603" letter-spacing="1">WEEK 5 • TNF FILM AUDIT</text>
  </g>
  <g transform="translate(60, 260)"><text x="0" y="55" class="font-heading-heavy" font-size="58" fill="#FFFFFF" letter-spacing="-1">BUCCANEERS @ COWBOYS:</text>
<text x="0" y="130" class="font-heading-heavy" font-size="64" fill="#FED603" letter-spacing="-1">THE 2 PREGAME</text>
<text x="0" y="205" class="font-heading-heavy" font-size="64" fill="#FFFFFF" letter-spacing="-1">ADJUSTMENTS</text>
<text x="0" y="270" class="font-body" font-size="22" fill="#A0A0A0" font-weight="500">A schematic breakdown of the ground game and pass-protection battles behind Thursday</text>
<text x="0" y="298" class="font-body" font-size="22" fill="#A0A0A0" font-weight="500">night in Arlington.</text></g>
  <g transform="translate(60, 590)"><rect x="0" y="0" width="465" height="380" rx="16" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="0" y="0" width="465" height="6" rx="3" fill="#FED603" />
    <g transform="translate(32, 45)">
      <text x="0" y="0" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1.5">ADJUSTMENT 01 • THE GROUND GAME</text>
      <text x="0" y="80" class="font-heading-heavy" font-size="76" fill="#FFFFFF">4.4 YPC</text>
      <text x="0" y="115" class="font-heading" font-size="18" fill="#FED603">TAMPA BAY'S RUSHING AVERAGE</text>
      <line x1="0" y1="140" x2="400" y2="140" stroke="#282828" stroke-width="1" />
      <text x="0" y="175" class="font-body" font-size="16" fill="#A0A0A0" font-weight="500">Dallas allows 4.8 a carry. Tampa Bay's defense</text>
<text x="0" y="200" class="font-body" font-size="16" fill="#A0A0A0" font-weight="500">allows just 3.2.</text>
      <rect x="0" y="235" width="400" height="50" rx="8" fill="#121212" stroke="#282828" stroke-width="1" />
      <circle cx="20" cy="260" r="5" fill="#10B981" />
      <text x="36" y="265" class="font-mono" font-size="12" fill="#FFFFFF">DAL OFFENSE: 3.8 YPC • TB DEFENSE: 3.2</text>
    </g>
<rect x="495" y="0" width="465" height="380" rx="16" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="495" y="0" width="465" height="6" rx="3" fill="#0C92F1" />
    <g transform="translate(527, 45)">
      <text x="0" y="0" class="font-mono" font-size="13" fill="#0C92F1" letter-spacing="1.5">ADJUSTMENT 02 • PRESSURE POINTS</text>
      <text x="0" y="80" class="font-heading-heavy" font-size="76" fill="#FFFFFF">16 &amp; 4</text>
      <text x="0" y="115" class="font-heading" font-size="18" fill="#0C92F1">TB SACKS ALLOWED &amp; DAL SACKS</text>
      <line x1="0" y1="140" x2="400" y2="140" stroke="#282828" stroke-width="1" />
      <text x="0" y="175" class="font-body" font-size="16" fill="#A0A0A0" font-weight="500">Tampa Bay has taken 16 sacks, the most in the NFL.</text>
<text x="0" y="200" class="font-body" font-size="16" fill="#A0A0A0" font-weight="500">Dallas has 4.</text>
      <rect x="0" y="235" width="400" height="50" rx="8" fill="#121212" stroke="#282828" stroke-width="1" />
      <circle cx="20" cy="260" r="5" fill="#EF4444" />
      <text x="36" y="265" class="font-mono" font-size="11" fill="#FFFFFF">DAL'S 2 SACKS VS HOU WERE ITS FIRST SINCE WEEK 1</text>
    </g></g>
  <g transform="translate(60, 1010)">
    <rect x="0" y="0" width="960" height="190" rx="16" fill="#121212" stroke="#383838" stroke-width="1.5" />
    <g transform="translate(36, 40)">
      <text x="0" y="0" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1.5">THE TACTICAL IMPERATIVE</text>
      <text x="0" y="34" class="font-heading" font-size="22" fill="#FFFFFF">Protection and the run game set the script Thursday night.</text>
      <text x="0" y="68" class="font-body" font-size="17" fill="#A0A0A0">A rookie quarterback behind the league's most-sacked line meets a Cowboys rush that has barely arrived.</text>
<text x="0" y="91" class="font-body" font-size="17" fill="#A0A0A0">Dallas's front, not its offense, may be the swing.</text>
      <circle cx="4" cy="131" r="4" fill="#FED603" /><text x="16" y="136" class="font-mono" font-size="13" fill="#666666">7-PAGE SLIDE DECK</text>
    </g>
  </g>
  
  <g transform="translate(60, 1260)">
    <line x1="0" y1="0" x2="960" y2="0" stroke="#282828" stroke-width="1" />
    <text x="0" y="36" class="font-body" font-size="14" fill="#A0A0A0" font-weight="600">TB @ DAL • THURSDAY NIGHT FOOTBALL</text>
    <text x="960" y="36" class="font-heading" font-size="14" fill="#FED603" letter-spacing="1" text-anchor="end">SWIPE FOR THE BLUEPRINT &gt;&gt;&gt;</text>
    <text x="0" y="62" class="font-mono" font-size="11" fill="#666666">DATA: NFL.COM, DALLASCOWBOYS.COM, BUCCANEERS.COM • THROUGH WEEK 4</text>
  </g>
</svg>