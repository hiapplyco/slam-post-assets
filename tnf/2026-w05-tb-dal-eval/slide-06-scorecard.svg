<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .font-heading { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .font-heading-heavy { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Menlo', monospace; font-weight: 700; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#000000" />
  <rect width="1080" height="1350" fill="url(#gridPattern)" />
  
  
  
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="14" height="28" rx="3" fill="#FED603" />
    <rect x="20" y="0" width="6" height="28" rx="3" fill="#0C92F1" />
    <text x="36" y="20" class="font-heading" font-size="20" fill="#FFFFFF" letter-spacing="2">SLAM SPORTS AI</text>
    <rect x="360" y="-2" width="261" height="32" rx="16" fill="#121212" stroke="#383838" stroke-width="1.5" />
    <circle cx="376" cy="14" r="5" fill="#FED603" />
    <text x="392" y="19" class="font-mono" font-size="12" fill="#FFFFFF" letter-spacing="1.5">FINAL AUDIT • SCORECARD</text>
    <text x="960" y="20" class="font-mono" font-size="15" fill="#666666" letter-spacing="2" text-anchor="end">06 / 07</text>
  </g>
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="249" height="34" rx="8" fill="rgba(254, 214, 3, 0.12)" stroke="#FED603" stroke-width="1.5" />
    <text x="16" y="22" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1">THE VALIDATION SCORECARD</text>
    <text x="0" y="85" class="font-heading-heavy" font-size="46" fill="#FFFFFF">THE PREGAME SCORECARD,</text>
    <text x="0" y="145" class="font-heading-heavy" font-size="46" fill="#FED603">GRADED</text>
    <text x="0" y="190" class="font-body" font-size="18" fill="#A0A0A0">We posted 3 metrics (6 benchmarks) before kickoff. Here is how each one finished.</text>
  </g>
  <g transform="translate(60, 390)"><g transform="translate(0, 0)">
      <rect x="0" y="0" width="960" height="200" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
      <rect x="0" y="0" width="10" height="200" rx="5" fill="#FED603" />
      <g transform="translate(40, 36)">
        <text x="0" y="0" class="font-mono" font-size="13" fill="#FED603">METRIC 01 • SACKS</text>
        <text x="0" y="34" class="font-heading" font-size="24" fill="#FFFFFF">1 of 2 benchmarks hit</text>
        <text x="0" y="68" class="font-body" font-size="15" fill="#A0A0A0">Dallas 4+ sacks: MISS (1). TB 2 or fewer allowed: HIT (1 allowed).</text>
        <rect x="0" y="105" width="880" height="42" rx="8" fill="#121212" stroke="#282828" stroke-width="1" />
        <text x="20" y="132" class="font-mono" font-size="13" fill="#FFFFFF">IF IT HOLDS: </text>
        <text x="124" y="132" class="font-mono" font-size="13" fill="#FED603">PASS ON PROTECTION, FAIL ON RUSH</text>
      </g>
    </g>
<g transform="translate(0, 225)">
      <rect x="0" y="0" width="960" height="200" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
      <rect x="0" y="0" width="10" height="200" rx="5" fill="#0C92F1" />
      <g transform="translate(40, 36)">
        <text x="0" y="0" class="font-mono" font-size="13" fill="#0C92F1">METRIC 02 • YARDS PER CARRY</text>
        <text x="0" y="34" class="font-heading" font-size="24" fill="#FFFFFF">2 of 2 benchmarks hit</text>
        <text x="0" y="68" class="font-body" font-size="15" fill="#A0A0A0">TB 4.4+: HIT (6.2). DAL 3.8+: HIT (3.8, 50 yards on 13 carries).</text>
        <rect x="0" y="105" width="880" height="42" rx="8" fill="#121212" stroke="#282828" stroke-width="1" />
        <text x="20" y="132" class="font-mono" font-size="13" fill="#FFFFFF">IF IT HOLDS: </text>
        <text x="124" y="132" class="font-mono" font-size="13" fill="#10B981">BOTH BENCHMARKS MET</text>
      </g>
    </g>
<g transform="translate(0, 450)">
      <rect x="0" y="0" width="960" height="200" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
      <rect x="0" y="0" width="10" height="200" rx="5" fill="#10B981" />
      <g transform="translate(40, 36)">
        <text x="0" y="0" class="font-mono" font-size="13" fill="#10B981">METRIC 03 • THIRD DOWN</text>
        <text x="0" y="34" class="font-heading" font-size="24" fill="#FFFFFF">1 of 2 benchmarks hit</text>
        <text x="0" y="68" class="font-body" font-size="15" fill="#A0A0A0">DAL 5-for-10: MISS (4-for-10). TB 4-for-12: HIT (7-for-13).</text>
        <rect x="0" y="105" width="880" height="42" rx="8" fill="#121212" stroke="#282828" stroke-width="1" />
        <text x="20" y="132" class="font-mono" font-size="13" fill="#FFFFFF">IF IT HOLDS: </text>
        <text x="124" y="132" class="font-mono" font-size="13" fill="#10B981">TAMPA BAY KEPT DRIVES ALIVE</text>
      </g>
    </g></g>
  <g transform="translate(60, 1080)">
    <rect x="0" y="0" width="960" height="140" rx="16" fill="#121212" stroke="#FED603" stroke-width="1.5" />
    <g transform="translate(36, 36)">
      <text x="0" y="0" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1">FINAL GRADE: 4 OF 6</text>
      <text x="0" y="34" class="font-heading" font-size="20" fill="#FFFFFF">We nailed the run game and missed the pass rush.</text>
      <text x="0" y="64" class="font-body" font-size="15" fill="#A0A0A0">Benchmarks are from our Week 5 pregame pack. Final stats: team sites and ESPN.</text>
    </g>
  </g>
  
  <g transform="translate(60, 1260)">
    <line x1="0" y1="0" x2="960" y2="0" stroke="#282828" stroke-width="1" />
    <text x="0" y="36" class="font-body" font-size="14" fill="#A0A0A0" font-weight="600">TB @ DAL • THURSDAY NIGHT FOOTBALL</text>
    <text x="960" y="36" class="font-heading" font-size="14" fill="#FED603" letter-spacing="1" text-anchor="end">NEXT: JOIN THE DISCUSSION &gt;&gt;&gt;</text>
    <text x="0" y="62" class="font-mono" font-size="11" fill="#666666">DATA: NFL.COM, ESPN, BUCCANEERS.COM, DALLASCOWBOYS.COM • WEEK 5 FINAL</text>
  </g>
</svg>