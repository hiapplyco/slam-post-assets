<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .font-heading { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .font-heading-heavy { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Menlo', monospace; font-weight: 700; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#000000" />
  <rect width="1080" height="1350" fill="url(#gridPattern)" />
  
  
  
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="14" height="28" rx="3" fill="#FED603" />
    <rect x="20" y="0" width="6" height="28" rx="3" fill="#0C92F1" />
    <text x="36" y="20" class="font-heading" font-size="20" fill="#FFFFFF" letter-spacing="2">SLAM SPORTS AI</text>
    <rect x="360" y="-2" width="314" height="32" rx="16" fill="#121212" stroke="#383838" stroke-width="1.5" />
    <circle cx="376" cy="14" r="5" fill="#FED603" />
    <text x="392" y="19" class="font-mono" font-size="12" fill="#FFFFFF" letter-spacing="1.5">ADJUSTMENT 01 • THE BLUEPRINT</text>
    <text x="960" y="20" class="font-mono" font-size="15" fill="#666666" letter-spacing="2" text-anchor="end">03 / 07</text>
  </g>
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="231" height="34" rx="8" fill="rgba(254, 214, 3, 0.12)" stroke="#FED603" stroke-width="1.5" />
    <text x="16" y="22" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1">THE TACTICAL BLUEPRINT</text>
    <text x="0" y="85" class="font-heading-heavy" font-size="46" fill="#FFFFFF">THE BLUEPRINT:</text>
    <text x="0" y="145" class="font-heading-heavy" font-size="46" fill="#FED603">RUN TO SET UP THE PASS</text>
    <text x="0" y="190" class="font-body" font-size="18" fill="#A0A0A0">How Pittsburgh could turn a ground-game edge into a manageable script.</text>
  </g>
  <g transform="translate(60, 390)"><g transform="translate(0, 0)">
      <rect x="0" y="0" width="960" height="145" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="145" rx="4" fill="#FED603" />
      <g transform="translate(36, 32)">
        <text x="0" y="0" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1">STEP 1 • LEAN ON WARREN</text>
        <text x="0" y="32" class="font-heading" font-size="20" fill="#FFFFFF">Warren carries the early-down load</text>
        <text x="0" y="64" class="font-body" font-size="15" fill="#A0A0A0">Warren has 38 carries and 9 rushing first downs, with a 50% rush success rate through three games.</text>
      </g>
    </g>
<g transform="translate(0, 165)">
      <rect x="0" y="0" width="960" height="145" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="145" rx="4" fill="#FED603" />
      <g transform="translate(36, 32)">
        <text x="0" y="0" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1">STEP 2 • KEEP THE TREND GOING</text>
        <text x="0" y="32" class="font-heading" font-size="20" fill="#FFFFFF">Build on a 138-yard Week 3</text>
        <text x="0" y="64" class="font-body" font-size="15" fill="#A0A0A0">Pittsburgh ran for 138 yards vs. Cincinnati after 58 and 91. The team averages 4.3 a carry on 67 rushes.</text>
      </g>
    </g>
<g transform="translate(0, 330)">
      <rect x="0" y="0" width="960" height="145" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
      <rect x="0" y="0" width="8" height="145" rx="4" fill="#10B981" />
      <g transform="translate(36, 32)">
        <text x="0" y="0" class="font-mono" font-size="13" fill="#10B981" letter-spacing="1">STEP 3 • WIN THIRD DOWN</text>
        <text x="0" y="32" class="font-heading" font-size="20" fill="#FFFFFF">Shorter distances keep drives alive</text>
        <text x="0" y="64" class="font-body" font-size="15" fill="#A0A0A0">Pittsburgh is 12-for-37 on third down (32.4%), 29th in the NFL. Cleveland's opponents are 16-for-41.</text>
      </g>
    </g></g>
  <g transform="translate(60, 910)">
    <rect x="0" y="0" width="960" height="290" rx="16" fill="#121212" stroke="#383838" stroke-width="1.5" />
    <g transform="translate(40, 40)">
      <text x="0" y="0" class="font-mono" font-size="13" fill="#FED603" letter-spacing="1.5">THE NUMBERS BEHIND THE PLAN</text>
      <g transform="translate(0, 45)"><g transform="translate(0, 0)">
      <text x="0" y="50" class="font-heading-heavy" font-size="56" fill="#FFFFFF">138</text>
      <text x="0" y="85" class="font-mono" font-size="13" fill="#FED603">PIT RUSH YARDS, WK 3</text>
      <text x="0" y="112" class="font-body" font-size="14" fill="#A0A0A0">Up from 58, then 91</text>
    </g><line x1="290" y1="10" x2="290" y2="150" stroke="#282828" stroke-width="1" />
<g transform="translate(320, 0)">
      <text x="0" y="50" class="font-heading-heavy" font-size="56" fill="#FFFFFF">32.4%</text>
      <text x="0" y="85" class="font-mono" font-size="13" fill="#10B981">PIT THIRD-DOWN RATE</text>
      <text x="0" y="112" class="font-body" font-size="14" fill="#A0A0A0">29th in the NFL after Week 3</text>
    </g><line x1="610" y1="10" x2="610" y2="150" stroke="#282828" stroke-width="1" />
<g transform="translate(640, 0)">
      <text x="0" y="50" class="font-heading-heavy" font-size="56" fill="#FFFFFF">4.5</text>
      <text x="0" y="85" class="font-mono" font-size="13" fill="#0C92F1">CLE YPC ALLOWED</text>
      <text x="0" y="112" class="font-body" font-size="14" fill="#A0A0A0">361 yards on 80 carries</text>
    </g></g>
      <rect x="0" y="195" width="880" height="40" rx="8" fill="#1A1A1A" /><text x="20" y="221" class="font-mono" font-size="12" fill="#FED603">LIVE IN-GAME TRIGGER: TRACK PITTSBURGH'S FIRST-DOWN CALLS, RUN OR PASS?</text>
    </g>
  </g>
  
  <g transform="translate(60, 1260)">
    <line x1="0" y1="0" x2="960" y2="0" stroke="#282828" stroke-width="1" />
    <text x="0" y="36" class="font-body" font-size="14" fill="#A0A0A0" font-weight="600">PIT @ CLE • THURSDAY NIGHT FOOTBALL</text>
    <text x="960" y="36" class="font-heading" font-size="13" fill="#FED603" letter-spacing="1" text-anchor="end">NEXT: ADJUSTMENT 2 - PRESSURE POINTS &gt;&gt;&gt;</text>
    <text x="0" y="62" class="font-mono" font-size="11" fill="#666666">DATA: PRO-FOOTBALL-REFERENCE, STEELERS.COM, CLEVELANDBROWNS.COM • THROUGH WEEK 3</text>
  </g>
</svg>