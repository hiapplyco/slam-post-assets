<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@600;700&amp;display=swap');
      .font-heading { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
      .font-heading-heavy { font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; }
      .font-body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Menlo', monospace; font-weight: 700; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161616" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1080" height="1350" fill="#000000" />
  <rect width="1080" height="1350" fill="url(#gridPattern)" />
  
  
  
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="14" height="28" rx="3" fill="#FED603" />
    <rect x="20" y="0" width="6" height="28" rx="3" fill="#0C92F1" />
    <text x="36" y="20" class="font-heading" font-size="20" fill="#FFFFFF" letter-spacing="2">SLAM SPORTS AI</text>
    <rect x="360" y="-2" width="200" height="32" rx="16" fill="#121212" stroke="#383838" stroke-width="1.5" />
    <circle cx="376" cy="14" r="5" fill="#FED603" />
    <text x="392" y="19" class="font-mono" font-size="12" fill="#FFFFFF" letter-spacing="1.5">SLAM SPORTS AI</text>
    <text x="960" y="20" class="font-mono" font-size="15" fill="#666666" letter-spacing="2" text-anchor="end">07 / 07</text>
  </g>
  <g transform="translate(60, 160)">
    <rect x="0" y="0" width="960" height="420" rx="20" fill="#0A0A0A" stroke="#383838" stroke-width="1.5" filter="url(#cardShadow)"/>
    <circle cx="800" cy="100" r="180" fill="#FED603" opacity="0.08" filter="blur(60px)"/>
    <circle cx="200" cy="300" r="180" fill="#0C92F1" opacity="0.08" filter="blur(60px)"/>
    <g transform="translate(60, 60)">
      <rect x="0" y="0" width="22" height="48" rx="4" fill="#FED603" />
      <rect x="30" y="0" width="10" height="48" rx="4" fill="#0C92F1" />
      <text x="56" y="35" class="font-heading-heavy" font-size="34" fill="#FFFFFF" letter-spacing="2">SLAM SPORTS AI</text>
      <text x="0" y="115" class="font-mono" font-size="14" fill="#FED603" letter-spacing="2">AI-POWERED SPORTS INTELLIGENCE</text>
      <text x="0" y="180" class="font-heading-heavy" font-size="46" fill="#FFFFFF" letter-spacing="-1">REAL SCHEME. REAL DATA.</text>
      <text x="0" y="235" class="font-heading-heavy" font-size="46" fill="#FED603" letter-spacing="-1">ZERO HOT TAKES.</text>
      <text x="0" y="285" class="font-body" font-size="17" fill="#A0A0A0">We replace narrative noise with schematic charting and film verification.</text>
    </g>
  </g>
  <g transform="translate(60, 610)"><rect x="0" y="0" width="300" height="220" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
    <g transform="translate(26, 32)">
      <text x="0" y="0" class="font-mono" font-size="12" fill="#FED603">PILLAR 01</text>
      <text x="0" y="36" class="font-heading" font-size="18" fill="#FFFFFF">LIVE TACTICAL</text>
      <text x="0" y="60" class="font-heading" font-size="18" fill="#FFFFFF">CHARTING</text>
      <text x="0" y="95" class="font-body" font-size="14" fill="#A0A0A0">Real-time tracking of box counts,</text>
<text x="0" y="115" class="font-body" font-size="14" fill="#A0A0A0">coverage shells, and pressure</text>
<text x="0" y="135" class="font-body" font-size="14" fill="#A0A0A0">rates.</text>
    </g>
<rect x="330" y="0" width="300" height="220" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
    <g transform="translate(356, 32)">
      <text x="0" y="0" class="font-mono" font-size="12" fill="#0C92F1">PILLAR 02</text>
      <text x="0" y="36" class="font-heading" font-size="18" fill="#FFFFFF">SECOND-HALF</text>
      <text x="0" y="60" class="font-heading" font-size="18" fill="#FFFFFF">ADJUSTMENTS</text>
      <text x="0" y="95" class="font-body" font-size="14" fill="#A0A0A0">Coordinator adjustments modeled</text>
<text x="0" y="115" class="font-body" font-size="14" fill="#A0A0A0">during the halftime window.</text>
    </g>
<rect x="660" y="0" width="300" height="220" rx="14" fill="#0A0A0A" stroke="#282828" stroke-width="1.5" />
    <g transform="translate(686, 32)">
      <text x="0" y="0" class="font-mono" font-size="12" fill="#10B981">PILLAR 03</text>
      <text x="0" y="36" class="font-heading" font-size="18" fill="#FFFFFF">ACCOUNTABLE</text>
      <text x="0" y="60" class="font-heading" font-size="18" fill="#FFFFFF">FILM AUDITS</text>
      <text x="0" y="95" class="font-body" font-size="14" fill="#A0A0A0">Every pregame projection is</text>
<text x="0" y="115" class="font-body" font-size="14" fill="#A0A0A0">checked against the game film</text>
<text x="0" y="135" class="font-body" font-size="14" fill="#A0A0A0">afterward.</text>
    </g></g>
  <g transform="translate(60, 860)">
    <rect x="0" y="0" width="960" height="240" rx="16" fill="#121212" stroke="#383838" stroke-width="1.5" />
