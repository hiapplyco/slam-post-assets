    <g transform="translate(36, 34)">
      <text x="0" y="0" class="font-mono" font-size="13" fill="#FFFFFF">INSTAGRAM: <tspan fill="#FED603">@SLAMSPORTSAI</tspan>   •   LINKEDIN: <tspan fill="#0C92F1">SLAM SPORTS AI</tspan></text>
      <text x="0" y="28" class="font-body" font-size="13" fill="#666666">© 2026 SLAM Sports AI Inc. All rights reserved.</text>
    </g>
  </g>
  
  <g transform="translate(60, 1260)">
    <line x1="0" y1="0" x2="960" y2="0" stroke="#282828" stroke-width="1" />
    <text x="0" y="36" class="font-body" font-size="14" fill="#A0A0A0" font-weight="600">PIT @ CLE • THURSDAY NIGHT FOOTBALL</text>
    <text x="960" y="36" class="font-heading" font-size="14" fill="#FED603" letter-spacing="1" text-anchor="end">SAVE &amp; SHARE THIS REPORT</text>
    <text x="0" y="62" class="font-mono" font-size="11" fill="#666666">DATA: PRO-FOOTBALL-REFERENCE, STEELERS.COM, CLEVELANDBROWNS.COM • THROUGH WEEK 3</text>
