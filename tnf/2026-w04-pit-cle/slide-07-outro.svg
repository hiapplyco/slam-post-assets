        <text x="205" y="27" class="font-heading" font-size="14" fill="#000000" text-anchor="middle">FOLLOW @SLAMSPORTSAI</text>
        <rect x="430" y="0" width="450" height="44" rx="8" fill="#1A1A1A" stroke="#383838" stroke-width="1" />
        <text x="655" y="27" class="font-mono" font-size="13" fill="#FFFFFF" text-anchor="middle">VISIT WWW.SLAMSPORTS.AI</text>
      </g>
